<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>滿版華麗互動班表 (支援多選與換行備註)</title>

  <!-- 引入 Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://workshift-a66f0-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbOnValue = onValue;
    window.dbSet = set;
    window.dbRemove = remove;
    window.dbUpdate = update;
  </script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      --card-glass: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      
      --shift-day-bg: linear-gradient(135deg, #2563eb, #3b82f6);
      --shift-day-glow: rgba(59, 130, 246, 0.6);
      
      --shift-noon-bg: linear-gradient(135deg, #f59e0b, #fbbf24);
      --shift-noon-glow: rgba(245, 158, 11, 0.6);

      --shift-night-bg: linear-gradient(135deg, #7c3aed, #a855f7);
      --shift-night-glow: rgba(168, 85, 247, 0.6);
      
      --shift-r-off-cell-bg: rgba(220, 38, 38, 0.35);
      --shift-r-off-cell-border: rgba(248, 113, 113, 0.8);
      --shift-r-off-bg: linear-gradient(135deg, #dc2626, #ef4444);
      --shift-r-off-glow: rgba(239, 68, 68, 0.8);

      --shift-off-bg: linear-gradient(135deg, #ec4899, #f472b6);
      --shift-off-glow: rgba(244, 114, 182, 0.7);
      
      --shift-custom-bg: linear-gradient(135deg, #ff007f, #7928ca);
      --shift-custom-glow: rgba(255, 0, 127, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }

    .bg-glow-1 {
      width: 280px; height: 280px;
      background: #7928ca;
      top: -50px; left: -50px;
    }

    .bg-glow-2 {
      width: 250px; height: 250px;
      background: #ff007f;
      bottom: -40px; right: -40px;
      animation-delay: -4s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.15); }
    }

    .calendar-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 12px 8px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .header h2 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(to right, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #fff;
      cursor: pointer;
    }

    .nav-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    .status-bar {
      text-align: center;
      font-size: 0.7rem;
      color: #38f9d7;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #38f9d7;
      border-radius: 50%;
      box-shadow: 0 0 8px #38f9d7;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .weekdays div:nth-child(6),
    .weekdays div:nth-child(7) {
      color: #f472b6;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 4px;
      flex-grow: 1;
      height: 100%;
    }

    .day-cell {
      border-radius: 10px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .day-cell.empty {
      border: none;
      background: transparent;
      cursor: default;
    }

    .day-number {
      font-size: 0.82rem;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      line-height: 1.1;
    }

    .day-cell.today {
      border: 2px solid #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .day-cell.today .day-number {
      background: #ffd700;
      color: #000;
      border-radius: 50%;
      width: 18px; height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.8);
    }

    .day-cell.selected {
      border: 2px solid #00f2fe !important;
      background: rgba(0, 242, 254, 0.25) !important;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.6) !important;
      transform: scale(0.96);
    }

    .day-cell.cell-r-off {
      background: var(--shift-r-off-cell-bg) !important;
      border: 1px solid var(--shift-r-off-cell-border) !important;
      box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.4);
    }

    /* 班別與備註標籤：支援換行 (pre-wrap) */
    .shift-tag {
      width: 98%;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 1px;
      border-radius: 5px;
      color: #fff;
      line-height: 1.15;
      word-break: break-all;
      white-space: pre-wrap; /* 支援換行顯示 */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .shift-day { background: var(--shift-day-bg); box-shadow: 0 0 8px var(--shift-day-glow); }
    .shift-noon { background: var(--shift-noon-bg); color: #4a2800; box-shadow: 0 0 8px var(--shift-noon-glow); }
    .shift-night { background: var(--shift-night-bg); box-shadow: 0 0 8px var(--shift-night-glow); }
    .shift-r-off { background: var(--shift-r-off-bg); box-shadow: 0 0 8px var(--shift-r-off-glow); }
    .shift-off { background: var(--shift-off-bg); color: #fff; box-shadow: 0 0 8px var(--shift-off-glow); }
    .shift-custom { background: var(--shift-custom-bg); box-shadow: 0 0 8px var(--shift-custom-glow); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(30, 27, 75, 0.92);
      border: 1px solid var(--card-border);
      width: 90%;
      max-width: 340px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(121, 40, 202, 0.4);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h3 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      text-align: center;
      color: #fff;
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .quick-btn {
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }

    .quick-btn:active {
      transform: scale(0.95);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    /* 多行文字輸入框 (Textarea) */
    .input-group textarea {
      width: 100%;
      height: 64px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
      resize: none;
      user-select: text;
    }

    .input-group textarea:focus {
      border-color: #ff007f;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-save { background: linear-gradient(135deg, #ff007f, #7928ca); color: #fff; box-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }

    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: explode 0.6s ease-out forwards;
    }

    @keyframes explode {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="calendar-container">
    <div class="header">
      <button class="nav-btn" onclick="changeMonth(-1)">‹ 上個月</button>
      <h2 id="month-title"></h2>
      <button class="nav-btn" onclick="changeMonth(1)">下個月 ›</button>
    </div>

    <div class="status-bar">
      <div class="status-dot"></div>
      <span>Firebase 雲端同步 (支援換行備註)</span>
    </div>

    <div class="weekdays">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>

    <div class="days-grid" id="days-grid"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-date-title">統一設定班別與備註</h3>
      
      <div class="quick-btns">
        <button class="quick-btn shift-day" onclick="setQuick('早班')">早班</button>
        <button class="quick-btn shift-noon" onclick="setQuick('中班')">中班</button>
        <button class="quick-btn shift-night" onclick="setQuick('晚班')">晚班</button>
        <button class="quick-btn shift-r-off" onclick="setQuick('輪休')">輪休</button>
        <button class="quick-btn shift-off" onclick="setQuick('休假')">休假</button>
        <button class="quick-btn" style="background: rgba(255,255,255,0.2); color:#fff;" onclick="setQuick('')">清除</button>
      </div>

      <div class="input-group">
        <label>自訂備註 / 班別（可按 Enter 換行）：</label>
        <textarea id="shift-input" placeholder="例如：&#10;早班&#10;開會"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-action btn-save" onclick="saveData()">儲存同步</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let shiftData = {};

    let isDragging = false;
    let selectedDates = new Set();

    window.addEventListener('DOMContentLoaded', () => {
      const checkFirebase = setInterval(() => {
        if (window.db) {
          clearInterval(checkFirebase);
          initFirebaseListener();
        }
      }, 100);

      setupDragSelection();
    });

    function initFirebaseListener() {
      const shiftsRef = window.dbRef(window.db, 'shifts');
      window.dbOnValue(shiftsRef, (snapshot) => {
        const val = snapshot.val();
        shiftData = val || {};
        renderCalendar();
      });
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('month-title').innerText = `${year} 年 ${month + 1} 月`;

      const grid = document.getElementById('days-grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startOffset; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        grid.appendChild(emptyCell);
      }

      const today = new Date();
      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        cell.dataset.date = dateStr;

        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          cell.classList.add('today');
        }

        const dayNumNode = document.createElement('div');
        dayNumNode.className = 'day-number';
        dayNumNode.innerText = day;
        cell.appendChild(dayNumNode);

        const shift = shiftData[dateStr] || '';
        if (shift) {
          const shiftNode = document.createElement('div');
          shiftNode.className = 'shift-tag';
          shiftNode.innerText = shift;

          const firstLine = shift.split('\n')[0].trim();

          if (firstLine === '早班' || firstLine === '早') shiftNode.classList.add('shift-day');
          else if (firstLine === '中班' || firstLine === '中') shiftNode.classList.add('shift-noon');
          else if (firstLine === '晚班' || firstLine === '晚') shiftNode.classList.add('shift-night');
          else if (firstLine === '輪休') {
            shiftNode.classList.add('shift-r-off');
            cell.classList.add('cell-r-off');
          } else if (firstLine === '休假' || firstLine === '休') shiftNode.classList.add('shift-off');
          else shiftNode.classList.add('shift-custom');

          cell.appendChild(shiftNode);
        }

        grid.appendChild(cell);
      }
    }

    function setupDragSelection() {
      const grid = document.getElementById('days-grid');

      const getCellFromPoint = (x, y) => {
        const elem = document.elementFromPoint(x, y);
        return elem ? elem.closest('.day-cell:not(.empty)') : null;
      };

      const startSelection = (x, y) => {
        const cell = getCellFromPoint(x, y);
        if (!cell) return;
        isDragging = true;
        selectedDates.clear();
        toggleCellSelection(cell);
      };

      const moveSelection = (x, y) => {
        if (!isDragging) return;
        const cell = getCellFromPoint(x, y);
        if (cell) {
          toggleCellSelection(cell);
        }
      };

      const endSelection = (x, y) => {
        if (!isDragging) return;
        isDragging = false;
        if (selectedDates.size > 0) {
          createParticles(x || window.innerWidth/2, y || window.innerHeight/2);
          openModal();
        }
      };

      grid.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        startSelection(t.clientX, t.clientY);
      }, { passive: true });

      grid.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        moveSelection(t.clientX, t.clientY);
      }, { passive: true });

      grid.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        endSelection(t.clientX, t.clientY);
      });

      grid.addEventListener('mousedown', (e) => startSelection(e.clientX, e.clientY));
      grid.addEventListener('mousemove', (e) => moveSelection(e.clientX, e.clientY));
      window.addEventListener('mouseup', (e) => endSelection(e.clientX, e.clientY));
    }

    function toggleCellSelection(cell) {
      const dateStr = cell.dataset.date;
      if (!dateStr) return;
      if (!selectedDates.has(dateStr)) {
        selectedDates.add(dateStr);
        cell.classList.add('selected');
      }
    }

    function clearSelectionUI() {
      document.querySelectorAll('.day-cell.selected').forEach(cell => {
        cell.classList.remove('selected');
      });
      selectedDates.clear();
    }

    function openModal() {
      const title = document.getElementById('modal-date-title');
      if (selectedDates.size === 1) {
        const date = Array.from(selectedDates)[0];
        title.innerText = `${parseInt(date.split('-')[1])}月${parseInt(date.split('-')[2])}日 班別設定`;
        document.getElementById('shift-input').value = shiftData[date] || '';
      } else {
        title.innerText = `已選擇 ${selectedDates.size} 天，統一設定班別：`;
        document.getElementById('shift-input').value = '';
      }
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      clearSelectionUI();
    }

    function setQuick(val) {
      document.getElementById('shift-input').value = val;
      saveData();
    }

    function saveData() {
      const val = document.getElementById('shift-input').value.trim();
      const updates = {};

      selectedDates.forEach(dateStr => {
        updates[`shifts/${dateStr}`] = val ? val : null;
      });

      window.dbUpdate(window.dbRef(window.db), updates);
      closeModal();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function createParticles(x, y) {
      const colors = ['#00f2fe', '#ff007f', '#7928ca', '#43e97b', '#ffd700'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        document.body.appendChild(p);

        const size = Math.random() * 6 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 50 + 20;
        p.style.setProperty('--dx', `${Math.cos(angle) * speed}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * speed}px`);

        setTimeout(() => p.remove(), 600);
      }
    }

    renderCalendar();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>即時同步華麗互動班表</title>

  <!-- 引入 Firebase SDK (v9 模組化 CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // Firebase 配置 (連結您的 Realtime Database)
    const firebaseConfig = {
      databaseURL: "https://workshift-a66f0-default-rtdb.firebaseio.com/"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 將 Firebase 操控方法暴露給全域腳本使用
    window.db = db;
    window.dbRef = ref;
    window.dbOnValue = onValue;
    window.dbSet = set;
    window.dbRemove = remove;
  </script>

  <style>
    :root {
      /* 華麗夜空主題配色 */
      --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      --card-glass: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      
      /* 霓虹班別色彩 (帶發光效果) */
      --shift-day-bg: linear-gradient(135deg, #ff7eb3, #ff758c);
      --shift-day-glow: rgba(255, 117, 140, 0.6);
      
      --shift-noon-bg: linear-gradient(135deg, #f6d365, #fda085);
      --shift-noon-glow: rgba(253, 160, 133, 0.6);

      --shift-night-bg: linear-gradient(135deg, #7f7fd5, #86a8e7);
      --shift-night-glow: rgba(134, 168, 231, 0.6);
      
      --shift-r-off-bg: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      --shift-r-off-glow: rgba(161, 196, 253, 0.6);

      --shift-off-bg: linear-gradient(135deg, #43e97b, #38f9d7);
      --shift-off-glow: rgba(67, 233, 123, 0.5);
      
      --shift-custom-bg: linear-gradient(135deg, #ff007f, #7928ca);
      --shift-custom-glow: rgba(255, 0, 127, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 6px;
      overflow-x: hidden;
      position: relative;
    }

    /* 華麗背景浮動光斑 */
    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }

    .bg-glow-1 {
      width: 280px; height: 280px;
      background: #7928ca;
      top: -50px; left: -50px;
    }

    .bg-glow-2 {
      width: 250px; height: 250px;
      background: #ff007f;
      bottom: -40px; right: -40px;
      animation-delay: -4s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.15); }
    }

    /* 玻璃擬態卡片容器 */
    .calendar-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                  inset 0 0 15px rgba(255, 255, 255, 0.1);
    }

    /* 頂部標題與切換按鈕 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(to right, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
    }

    .nav-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    /* 雲端連線狀態燈 */
    .status-bar {
      text-align: center;
      font-size: 0.75rem;
      color: #38f9d7;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #38f9d7;
      border-radius: 50%;
      box-shadow: 0 0 8px #38f9d7;
    }

    /* 星期標籤 (週一至週日) */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .weekdays div:nth-child(6),
    .weekdays div:nth-child(7) {
      color: #ff758c;
    }

    /* 日曆網格與日期卡片 */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      aspect-ratio: 1 / 1.3;
      border-radius: 12px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .day-cell:active {
      transform: scale(0.9);
    }

    .day-cell.empty {
      border: none;
      background: transparent;
      cursor: default;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* 當天金邊標示 */
    .day-cell.today {
      border: 2px solid #ffd700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }

    .day-cell.today .day-number {
      background: #ffd700;
      color: #000;
      border-radius: 50%;
      width: 22px; height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    }

    /* 班別發光標籤 */
    .shift-tag {
      width: 95%;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 0;
      border-radius: 6px;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .shift-day { background: var(--shift-day-bg); box-shadow: 0 0 8px var(--shift-day-glow); }
    .shift-noon { background: var(--shift-noon-bg); color: #4a2800; box-shadow: 0 0 8px var(--shift-noon-glow); }
    .shift-night { background: var(--shift-night-bg); box-shadow: 0 0 8px var(--shift-night-glow); }
    .shift-r-off { background: var(--shift-r-off-bg); color: #0f3460; box-shadow: 0 0 8px var(--shift-r-off-glow); }
    .shift-off { background: var(--shift-off-bg); color: #042f2e; box-shadow: 0 0 8px var(--shift-off-glow); }
    .shift-custom { background: var(--shift-custom-bg); box-shadow: 0 0 8px var(--shift-custom-glow); }

    /* 華麗彈出視窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(30, 27, 75, 0.9);
      border: 1px solid var(--card-border);
      width: 90%;
      max-width: 340px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(121, 40, 202, 0.4);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h3 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      text-align: center;
      color: #fff;
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .quick-btn {
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .quick-btn:active {
      transform: scale(0.95);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
    }

    .input-group input:focus {
      border-color: #ff007f;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-save { background: linear-gradient(135deg, #ff007f, #7928ca); color: #fff; box-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }

    /* 粒子特效 */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: explode 0.6s ease-out forwards;
    }

    @keyframes explode {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 浮動背景霓虹光暈 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="calendar-container">
    <div class="header">
      <button class="nav-btn" onclick="changeMonth(-1)">‹ 上個月</button>
      <h2 id="month-title"></h2>
      <button class="nav-btn" onclick="changeMonth(1)">下個月 ›</button>
    </div>

    <!-- Firebase 即時同步連線狀態 -->
    <div class="status-bar">
      <div class="status-dot"></div>
      <span>Firebase 雲端同步中</span>
    </div>

    <!-- 週一至週日 -->
    <div class="weekdays">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>

    <div class="days-grid" id="days-grid"></div>
  </div>

  <!-- 華麗編輯視窗 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-date-title">設定班別與備註</h3>
      
      <!-- 快速按鈕區：早班 中班 晚班 輪休 休假 -->
      <div class="quick-btns">
        <button class="quick-btn shift-day" onclick="setQuick('早班')">早班</button>
        <button class="quick-btn shift-noon" onclick="setQuick('中班')">中班</button>
        <button class="quick-btn shift-night" onclick="setQuick('晚班')">晚班</button>
        <button class="quick-btn shift-r-off" onclick="setQuick('輪休')">輪休</button>
        <button class="quick-btn shift-off" onclick="setQuick('休假')">休假</button>
        <button class="quick-btn" style="background: rgba(255,255,255,0.2); color:#fff;" onclick="setQuick('')">清除</button>
      </div>

      <div class="input-group">
        <label>自訂備註 / 班別：</label>
        <input type="text" id="shift-input" placeholder="例：特休、會議、支援" maxlength="6">
      </div>

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-action btn-save" onclick="saveData()">儲存同步</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDateStr = '';
    let shiftData = {}; // 來自 Firebase 的資料

    // 當頁面加載完成後，開始監聽 Firebase 資料庫變動
    window.addEventListener('DOMContentLoaded', () => {
      const checkFirebase = setInterval(() => {
        if (window.db) {
          clearInterval(checkFirebase);
          initFirebaseListener();
        }
      }, 100);
    });

    function initFirebaseListener() {
      const shiftsRef = window.dbRef(window.db, 'shifts');
      
      // onValue 會在開啟頁面或資料庫內容被任何人更改時，即時觸發更新
      window.dbOnValue(shiftsRef, (snapshot) => {
        const val = snapshot.val();
        shiftData = val || {};
        renderCalendar();
      });
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('month-title').innerText = `${year} 年 ${month + 1} 月`;

      const grid = document.getElementById('days-grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startOffset; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        grid.appendChild(emptyCell);
      }

      const today = new Date();
      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        cell.onclick = (e) => {
          createParticles(e.clientX, e.clientY);
          openModal(dateStr, day);
        };

        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          cell.classList.add('today');
        }

        const dayNumNode = document.createElement('div');
        dayNumNode.className = 'day-number';
        dayNumNode.innerText = day;
        cell.appendChild(dayNumNode);

        const shift = shiftData[dateStr] || '';
        if (shift) {
          const shiftNode = document.createElement('div');
          shiftNode.className = 'shift-tag';
          shiftNode.innerText = shift;

          if (shift === '早班' || shift === '早') shiftNode.classList.add('shift-day');
          else if (shift === '中班' || shift === '中') shiftNode.classList.add('shift-noon');
          else if (shift === '晚班' || shift === '晚') shiftNode.classList.add('shift-night');
          else if (shift === '輪休') shiftNode.classList.add('shift-r-off');
          else if (shift === '休假' || shift === '休') shiftNode.classList.add('shift-off');
          else shiftNode.classList.add('shift-custom');

          cell.appendChild(shiftNode);
        }

        grid.appendChild(cell);
      }
    }

    function openModal(dateStr, day) {
      selectedDateStr = dateStr;
      const month = currentDate.getMonth() + 1;
      document.getElementById('modal-date-title').innerText = `${month}月${day}日 班別與備註`;
      document.getElementById('shift-input').value = shiftData[dateStr] || '';
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    function setQuick(val) {
      document.getElementById('shift-input').value = val;
      saveData();
    }

    // 儲存寫入 Firebase 雲端資料庫
    function saveData() {
      const val = document.getElementById('shift-input').value.trim();
      const targetRef = window.dbRef(window.db, `shifts/${selectedDateStr}`);

      if (val) {
        window.dbSet(targetRef, val);
      } else {
        window.dbRemove(targetRef); // 如果空白則從資料庫移除該日
      }
      
      closeModal();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    /* 點擊爆發火花特效 */
    function createParticles(x, y) {
      const colors = ['#ff007f', '#7928ca', '#00f2fe', '#43e97b', '#ffd700'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        document.body.appendChild(p);

        const size = Math.random() * 6 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 50 + 20;
        p.style.setProperty('--dx', `${Math.cos(angle) * speed}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * speed}px`);

        setTimeout(() => p.remove(), 600);
      }
    }

    renderCalendar();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>瑋的班表 v4.5 - 地圖實體嵌入與住宿分類版</title>

  <!-- 引入 Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://workshift-a66f0-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbOnValue = onValue;
    window.dbSet = set;
    window.dbRemove = remove;
    window.dbUpdate = update;
  </script>

  <style>
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    :root {
      --bg-gradient: linear-gradient(135deg, #050515 0%, #100b32 40%, #1a0b2e 70%, #080014 100%);
      --card-glass: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
      
      --shift-day-bg: linear-gradient(135deg, #00c6ff, #0072ff);
      --shift-day-glow: rgba(0, 198, 255, 0.8);
      
      --shift-noon-bg: linear-gradient(135deg, #f857a6, #ff5858);
      --shift-noon-glow: rgba(248, 87, 166, 0.8);

      --shift-night-bg: linear-gradient(135deg, #8a2387, #e94057, #f27121);
      --shift-night-glow: rgba(233, 64, 87, 0.8);
      
      --shift-r-off-cell-bg: radial-gradient(circle, rgba(255, 0, 127, 0.35) 0%, rgba(121, 40, 202, 0.45) 100%);
      --shift-r-off-cell-border: #ff007f;
      --shift-r-off-bg: linear-gradient(135deg, #ff007f, #7928ca, #ff8c00);
      --shift-r-off-glow: rgba(255, 0, 127, 0.9);

      --shift-off-cell-bg: radial-gradient(circle, rgba(254, 81, 150, 0.3) 0%, rgba(247, 112, 98, 0.3) 100%);
      --shift-off-cell-border: #fe5196;
      --shift-off-bg: linear-gradient(135deg, #ff758c, #ff7eb3, #fe5196);
      --shift-off-glow: rgba(254, 81, 150, 0.95);
      
      --shift-custom-bg: linear-gradient(135deg, #b224ef, #7579ff);
      --shift-custom-glow: rgba(178, 36, 239, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
      background: #050515;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      position: relative;
      perspective: 1000px;
    }

    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .orientation-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 5, 21, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .orientation-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      animation: rotatePhone 2s ease-in-out infinite alternate;
    }

    .orientation-overlay p {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(to right, #00f2fe, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes rotatePhone {
      0% { transform: rotate(0deg); }
      50%, 100% { transform: rotate(-90deg); }
    }

    @media screen and (orientation: landscape) and (max-height: 550px) {
      .orientation-overlay { display: flex; }
    }

    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      -webkit-filter: blur(90px);
      z-index: 0;
      opacity: 0.8;
      animation: float 10s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .bg-glow-1 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, #7928ca 0%, #ff007f 100%);
      top: -80px; left: -80px;
    }

    .bg-glow-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
      bottom: -60px; right: -60px;
      animation-delay: -5s;
    }

    .bg-glow-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #ff0844 0%, #ffb199 100%);
      top: 40%; left: 30%;
      animation-delay: -2.5s;
      opacity: 0.5;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(40px, 30px) scale(1.2) rotate(180deg); }
      100% { transform: translate(-20px, 50px) scale(0.9) rotate(360deg); }
    }

    .calendar-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--card-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 12px 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 
                  inset 0 0 20px rgba(255, 255, 255, 0.15),
                  0 0 15px rgba(255, 0, 127, 0.2);
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .tab-btn.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.6), rgba(0, 242, 254, 0.6));
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .page-content {
      display: none;
      flex-direction: column;
      flex-grow: 1;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .page-content.active {
      display: flex;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .mode-toggle-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }

    .mode-toggle-btn.edit-mode {
      background: #0d0722;
      border: 1px solid transparent;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
      transform: scale(1.05);
    }

    .mode-toggle-btn.edit-mode::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: conic-gradient(from var(--angle), #ff007f, #00f2fe, #7928ca, #ff007f);
      border-radius: 22px;
      z-index: -1;
      animation: rotateGradient 3s linear infinite;
    }

    @keyframes rotateGradient {
      to { --angle: 360deg; }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .header h2 {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(to right, #ffffff, #00f2fe, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .nav-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .status-bar {
      font-size: 0.72rem;
      font-weight: 600;
      color: #00f2fe;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 0 6px rgba(0, 242, 254, 0.6);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00f2fe;
      border-radius: 50%;
      box-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .weekdays div:nth-child(6),
    .weekdays div:nth-child(7) {
      color: #ff5858;
      text-shadow: 0 0 8px rgba(255, 88, 88, 0.5);
    }

    .days-grid-container {
      flex-grow: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .slider-track {
      display: flex;
      width: 300%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform: translate3d(-33.3333%, 0, 0);
      will-change: transform;
    }

    .slider-track.animate {
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      height: 100%;
      width: 33.3333%;
      flex-shrink: 0;
    }

    .day-cell {
      border-radius: 12px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .day-cell.empty {
      border: none;
      background: transparent;
      cursor: default;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .day-cell.today {
      border: 2px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.8), inset 0 0 10px rgba(255, 215, 0, 0.3);
      animation: todayGlow 3s infinite alternate;
    }

    @keyframes todayGlow {
      0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
      100% { box-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 30px rgba(255, 215, 0, 0.5); }
    }

    .day-cell.today .day-number {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #000;
      border-radius: 50%;
      width: 20px; height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 900;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.9);
    }

    .day-cell.selected {
      border: 2px solid transparent !important;
      background: rgba(0, 242, 254, 0.2) !important;
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.9) !important;
      transform: scale(0.94);
      position: relative;
    }

    .day-cell.selected::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: conic-gradient(from var(--angle), #00f2fe, #ff007f, #00f2fe);
      border-radius: 12px;
      z-index: -1;
      animation: rotateGradient 2s linear infinite;
    }

    .day-cell.cell-r-off {
      background: var(--shift-r-off-cell-bg) !important;
      border: 1.5px solid var(--shift-r-off-cell-border) !important;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 12px rgba(255, 0, 127, 0.4) !important;
      animation: rOffGlow 2.5s ease-in-out infinite alternate;
    }

    @keyframes rOffGlow {
      0% { box-shadow: 0 0 8px rgba(255, 0, 127, 0.5), inset 0 0 6px rgba(255, 0, 127, 0.3); transform: scale(1); }
      100% { box-shadow: 0 0 20px rgba(255, 0, 127, 0.9), 0 0 30px rgba(121, 40, 202, 0.8); transform: scale(1.02); }
    }

    .day-cell.cell-off {
      background: var(--shift-off-cell-bg) !important;
      border: 1.5px solid var(--shift-off-cell-border) !important;
      box-shadow: 0 0 15px rgba(254, 81, 150, 0.7), inset 0 0 12px rgba(254, 81, 150, 0.4) !important;
      animation: offGlow 2.5s ease-in-out infinite alternate;
    }

    @keyframes offGlow {
      0% { box-shadow: 0 0 8px rgba(254, 81, 150, 0.5), inset 0 0 6px rgba(254, 81, 150, 0.3); transform: scale(1); }
      100% { box-shadow: 0 0 22px rgba(254, 81, 150, 0.95), 0 0 32px rgba(255, 117, 140, 0.8); transform: scale(1.02); }
    }

    .shift-tag {
      width: 98%;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 2px;
      border-radius: 6px;
      color: #fff;
      line-height: 1.15;
      word-break: break-all;
      white-space: pre-wrap;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .shift-day { background: var(--shift-day-bg); box-shadow: 0 0 10px var(--shift-day-glow); }
    .shift-noon { background: var(--shift-noon-bg); color: #fff; box-shadow: 0 0 10px var(--shift-noon-glow); }
    .shift-night { background: var(--shift-night-bg); box-shadow: 0 0 10px var(--shift-night-glow); }
    
    .shift-r-off { 
      background: var(--shift-r-off-bg); 
      background-size: 200% 200%;
      box-shadow: 0 0 12px var(--shift-r-off-glow); 
      position: relative;
      overflow: hidden;
      animation: gradientShift 3s ease infinite;
    }

    .shift-r-off::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.8) 50%, transparent 70%);
      transform: rotate(30deg);
      animation: shine 2.5s infinite;
      pointer-events: none;
    }

    .shift-off { 
      background: var(--shift-off-bg); 
      background-size: 200% 200%;
      color: #fff; 
      box-shadow: 0 0 14px var(--shift-off-glow); 
      position: relative;
      overflow: hidden;
      animation: gradientShift 2.5s ease infinite;
    }

    .shift-off::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.9) 50%, transparent 70%);
      transform: rotate(30deg);
      animation: shine 2s infinite;
      pointer-events: none;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes shine {
      0% { transform: translateX(-150%) rotate(30deg); }
      100% { transform: translateX(150%) rotate(30deg); }
    }

    .shift-custom { background: var(--shift-custom-bg); box-shadow: 0 0 10px var(--shift-custom-glow); }

    /* ✈️ 旅遊規劃週視圖 */
    .travel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .travel-week-bar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .week-day-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 2px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .week-day-card .w-name {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .week-day-card .w-num {
      font-size: 0.85rem;
      font-weight: 900;
      color: #fff;
      margin-top: 2px;
    }

    .week-day-card.active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.4), rgba(255, 0, 127, 0.4));
      border: 1px solid #00f2fe;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
      transform: scale(1.05);
    }

    .has-plan-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #00f2fe;
      box-shadow: 0 0 6px #00f2fe, 0 0 10px #ff007f;
      position: absolute;
      bottom: 3px;
    }

    .timeline-container {
      flex-grow: 1;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 80px;
    }

    .timeline-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid #00f2fe;
      border-radius: 16px;
      padding: 14px 12px;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .timeline-item.type-food { border-left-color: #ff007f; }
    .timeline-item.type-hotel { border-left-color: #b224ef; }

    .timeline-info { flex-grow: 1; }

    .map-link {
      color: #ffffff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .map-link:active { opacity: 0.7; transform: scale(0.98); }

    .timeline-title { font-size: 1rem; font-weight: 800; color: #fff; }

    .timeline-delete {
      background: rgba(255, 88, 88, 0.2);
      border: none;
      color: #ff5858;
      width: 26px; height: 26px;
      border-radius: 50%;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .add-travel-btn {
      position: absolute;
      bottom: 35px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
    }

    /* 🗺️ 嵌入式動態地圖 iframe 樣式 */
    .embedded-map-container {
      margin-top: 10px;
      width: 100%;
      height: 160px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(0, 242, 254, 0.3);
      background: rgba(0, 0, 0, 0.4);
      display: none;
    }

    .embedded-map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(20, 15, 45, 0.95);
      border: 1px solid rgba(255, 0, 127, 0.4);
      width: 90%;
      max-width: 340px;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255, 0, 127, 0.5);
      transform: scale(0.7) translateY(30px);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 16px;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .quick-btn {
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .quick-btn.q-day { background: var(--shift-day-bg); box-shadow: 0 0 8px var(--shift-day-glow); }
    .quick-btn.q-noon { background: var(--shift-noon-bg); box-shadow: 0 0 8px var(--shift-noon-glow); }
    .quick-btn.q-night { background: var(--shift-night-bg); box-shadow: 0 0 8px var(--shift-night-glow); }
    .quick-btn.q-r-off { background: var(--shift-r-off-bg); box-shadow: 0 0 10px var(--shift-r-off-glow); }
    .quick-btn.q-off { background: var(--shift-off-bg); box-shadow: 0 0 10px var(--shift-off-glow); }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-group input, .input-group select, .input-group textarea {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 0.92rem;
      color: #fff;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-group select {
      background: rgba(30, 20, 60, 0.9);
      color: #fff;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 11px 0;
      border-radius: 12px;
      border: none;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-cancel { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-save { 
      background: linear-gradient(135deg, #ff007f, #7928ca); 
      color: #fff; 
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); 
    }

    .particle {
      position: absolute;
      pointer-events: none;
      z-index: 9999;
      animation: confetti 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes confetti {
      0% { transform: translate(0, 0) scale(1.8) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
      100% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="orientation-overlay">
    <div class="orientation-icon">📱</div>
    <p>請將手機轉為直式<br>以獲得最佳體驗✨</p>
  </div>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <div class="calendar-container" id="tilt-card">
    
    <div class="nav-tabs">
      <div class="tab-btn active" onclick="switchPage('shift')">📅 班表管理</div>
      <div class="tab-btn" onclick="switchPage('travel')">✈️ 旅遊規劃</div>
    </div>

    <!-- 📅 第一頁：班表管理 -->
    <div class="page-content active" id="shift-page">
      <div class="top-bar">
        <div class="status-bar">
          <div class="status-dot"></div>
          <span>資料同步儲存</span>
        </div>
        <button class="mode-toggle-btn" id="mode-btn" onclick="toggleEditMode()">
          <span id="mode-icon">👁️</span> <span id="mode-text">檢視模式</span>
        </button>
      </div>

      <div class="header">
        <button class="nav-btn" onclick="changeMonth(-1)">‹ 上個月</button>
        <h2 id="month-title"></h2>
        <button class="nav-btn" onclick="changeMonth(1)">下個月 ›</button>
      </div>

      <div class="weekdays">
        <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
      </div>

      <div class="days-grid-container" id="days-grid-container">
        <div class="slider-track" id="slider-track">
          <div class="days-grid" id="prev-grid"></div>
          <div class="days-grid" id="current-grid"></div>
          <div class="days-grid" id="next-grid"></div>
        </div>
      </div>
    </div>

    <!-- ✈️ 第二頁：旅遊規劃（週視圖） -->
    <div class="page-content" id="travel-page">
      <div class="travel-header">
        <button class="nav-btn" onclick="changeTravelWeek(-1)">‹ 上一週</button>
        <h2 id="travel-week-title" style="font-size: 1.05rem; font-weight: 900; background: linear-gradient(to right, #00f2fe, #ff007f); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></h2>
        <button class="nav-btn" onclick="changeTravelWeek(1)">下一週 ›</button>
      </div>

      <div class="travel-week-bar" id="travel-week-bar">
        <!-- 動態渲染一週七天 -->
      </div>

      <div class="timeline-container" id="timeline-list">
        <!-- 動態渲染行程 -->
      </div>

      <button class="add-travel-btn" onclick="openTravelModal()">+</button>
    </div>

  </div>

  <!-- 班表設定彈窗 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-date-title">統一設定班別與備註</h3>
      
      <div class="quick-btns">
        <button class="quick-btn q-day" onclick="setQuick('早班')">早班</button>
        <button class="quick-btn q-noon" onclick="setQuick('中班')">中班</button>
        <button class="quick-btn q-night" onclick="setQuick('晚班')">晚班</button>
        <button class="quick-btn q-r-off" onclick="setQuick('輪休')">🎉 輪休</button>
        <button class="quick-btn q-off" onclick="setQuick('休假')">🌸 休假</button>
        <button class="quick-btn" style="background: rgba(255,255,255,0.2); color:#fff;" onclick="setQuick('')">清除</button>
      </div>

      <div class="input-group">
        <label>自訂備註 / 班別：</label>
        <textarea id="shift-input" placeholder="例如：&#10;早班&#10;開會"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-action btn-save" onclick="saveData()">儲存同步</button>
      </div>
    </div>
  </div>

  <!-- ✈️ 新增旅遊行程彈窗：取消時間、增加住宿分類、實體 Google 地圖預覽 -->
  <div class="modal-overlay" id="travel-modal-overlay">
    <div class="modal">
      <h3>新增旅遊行程</h3>
      
      <!-- 分類選擇：景點 / 餐廳 / 住宿 -->
      <div class="input-group">
        <label>行程類別：</label>
        <select id="travel-type-input">
          <option value="spot">🎡 景點</option>
          <option value="food">🍴 餐廳</option>
          <option value="hotel">🏨 住宿</option>
        </select>
      </div>

      <!-- 景點/地點名稱輸入，驅動即時 Google 地圖 -->
      <div class="input-group">
        <label>景點 / 住宿名稱：</label>
        <input type="text" id="travel-title-input" placeholder="例如：東京星野飯店 / 東京鐵塔" oninput="updateEmbeddedMap(this.value)">
      </div>

      <!-- 實體嵌入式 Google 地圖視窗 -->
      <div class="embedded-map-container" id="map-iframe-box">
        <iframe id="map-iframe" src="" loading="lazy"></iframe>
      </div>

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="closeTravelModal()">取消</button>
        <button class="btn-action btn-save" onclick="saveTravelItem()">新增行程</button>
      </div>
    </div>
  </div>

  <script>
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth(); 

    let travelCurrentDate = new Date();

    let shiftData = {};
    let travelData = {};

    let isEditMode = false;
    let isDragging = false;
    let isSwiping = false;
    let selectedDates = new Set();

    let startX = 0; startY = 0; currentX = 0; currentY = 0; dragDeltaX = 0;
    let isHorizontalGesture = false;
    let mapTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
      const checkFirebase = setInterval(() => {
        if (window.db) {
          clearInterval(checkFirebase);
          initFirebaseListener();
        }
      }, 100);

      setupGestureControls();
      initBackgroundParticles();
      initGyroscopeTilt();
    });

    function initFirebaseListener() {
      const shiftsRef = window.dbRef(window.db, 'shifts');
      window.dbOnValue(shiftsRef, (snapshot) => {
        shiftData = snapshot.val() || {};
        renderAllCalendars();
      });

      const travelRef = window.dbRef(window.db, 'travel');
      window.dbOnValue(travelRef, (snapshot) => {
        travelData = snapshot.val() || {};
        renderTravelWeekBar();
      });
    }

    function switchPage(page) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));

      if (page === 'shift') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('shift-page').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('travel-page').classList.add('active');
        renderTravelWeekBar();
      }
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('mode-btn');
      const icon = document.getElementById('mode-icon');
      const text = document.getElementById('mode-text');

      if (isEditMode) {
        btn.classList.add('edit-mode');
        icon.innerText = '✏️';
        text.innerText = '編輯模式';
        createParticles(btn.offsetLeft + btn.offsetWidth/2, btn.offsetTop + btn.offsetHeight/2, 16);
      } else {
        btn.classList.remove('edit-mode');
        icon.innerText = '👁️';
        text.innerText = '檢視模式';
        clearSelectionUI();
      }
    }

    function renderAllCalendars() {
      document.getElementById('month-title').innerText = `${currentYear} 年 ${currentMonth + 1} 月`;

      renderSingleGrid(document.getElementById('prev-grid'), currentYear, currentMonth - 1);
      renderSingleGrid(document.getElementById('current-grid'), currentYear, currentMonth);
      renderSingleGrid(document.getElementById('next-grid'), currentYear, currentMonth + 1);

      const track = document.getElementById('slider-track');
      track.style.transform = `translate3d(-33.3333%, 0, 0)`;
    }

    function renderSingleGrid(gridElem, year, month) {
      gridElem.innerHTML = '';

      const targetDate = new Date(year, month, 1);
      const realYear = targetDate.getFullYear();
      const realMonth = targetDate.getMonth();

      const firstDay = targetDate.getDay(); 
      const startOffset = (firstDay + 6) % 7; 
      const totalDays = new Date(realYear, realMonth + 1, 0).getDate();

      for (let i = 0; i < startOffset; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        gridElem.appendChild(emptyCell);
      }

      const today = new Date();
      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const dateStr = `${realYear}-${String(realMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        cell.dataset.date = dateStr;

        if (day === today.getDate() && realMonth === today.getMonth() && realYear === today.getFullYear()) {
          cell.classList.add('today');
        }

        const dayNumNode = document.createElement('div');
        dayNumNode.className = 'day-number';
        dayNumNode.innerText = day;
        cell.appendChild(dayNumNode);

        const shift = shiftData[dateStr] || '';
        if (shift) {
          const shiftNode = document.createElement('div');
          shiftNode.className = 'shift-tag';

          const firstLine = shift.split('\n')[0].trim();

          if (firstLine === '早班' || firstLine === '早') {
            shiftNode.innerText = shift;
            shiftNode.classList.add('shift-day');
          } else if (firstLine === '中班' || firstLine === '中') {
            shiftNode.innerText = shift;
            shiftNode.classList.add('shift-noon');
          } else if (firstLine === '晚班' || firstLine === '晚') {
            shiftNode.innerText = shift;
            shiftNode.classList.add('shift-night');
          } else if (firstLine.includes('輪休')) {
            shiftNode.innerText = shift.includes('🎉') ? shift : `🎉 ${shift}`;
            shiftNode.classList.add('shift-r-off');
            cell.classList.add('cell-r-off');
          } else if (firstLine.includes('休假') || firstLine === '休') {
            shiftNode.innerText = shift.includes('🌸') ? shift : `🌸 ${shift}`;
            shiftNode.classList.add('shift-off');
            cell.classList.add('cell-off');
          } else {
            shiftNode.innerText = shift;
            shiftNode.classList.add('shift-custom');
          }

          cell.appendChild(shiftNode);
        }

        gridElem.appendChild(cell);
      }
    }

    function changeMonth(delta) {
      const track = document.getElementById('slider-track');

      track.classList.add('animate');
      const targetX = delta > 0 ? -66.6666 : 0;
      track.style.transform = `translate3d(${targetX}%, 0, 0)`;

      setTimeout(() => {
        track.classList.remove('animate');
        const nextDate = new Date(currentYear, currentMonth + delta, 1);
        currentYear = nextDate.getFullYear();
        currentMonth = nextDate.getMonth();
        renderAllCalendars();
      }, 300);
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function formatDateStr(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function changeTravelWeek(delta) {
      travelCurrentDate.setDate(travelCurrentDate.getDate() + (delta * 7));
      renderTravelWeekBar();
    }

    function renderTravelWeekBar() {
      const monday = getMonday(travelCurrentDate);
      const weekBar = document.getElementById('travel-week-bar');
      weekBar.innerHTML = '';

      const weekNames = ['一', '二', '三', '四', '五', '六', '日'];
      const selectedDateStr = formatDateStr(travelCurrentDate);

      document.getElementById('travel-week-title').innerText = `${monday.getFullYear()} 年 ${monday.getMonth() + 1} 月週行程`;

      for (let i = 0; i < 7; i++) {
        const day = new Date(monday);
        day.setDate(monday.getDate() + i);
        const dateStr = formatDateStr(day);

        const card = document.createElement('div');
        card.className = `week-day-card ${dateStr === selectedDateStr ? 'active' : ''}`;
        card.onclick = () => {
          travelCurrentDate = new Date(day);
          renderTravelWeekBar();
        };

        const hasPlan = travelData[dateStr] && Object.keys(travelData[dateStr]).length > 0;

        card.innerHTML = `
          <div class="w-name">週${weekNames[i]}</div>
          <div class="w-num">${day.getDate()}</div>
          ${hasPlan ? `<div class="has-plan-dot"></div>` : ''}
        `;

        weekBar.appendChild(card);
      }

      loadTravelItinerary(selectedDateStr);
    }

    function getGoogleMapsUrl(query) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    function loadTravelItinerary(dateStr) {
      const timelineContainer = document.getElementById('timeline-list');
      timelineContainer.innerHTML = '';

      const dayTravel = travelData[dateStr] || {};
      const keys = Object.keys(dayTravel);

      if (keys.length === 0) {
        timelineContainer.innerHTML = `<div style="text-align:center; color: var(--text-muted); font-size:0.85rem; margin-top:35px;">這天尚未規劃行程 ✨<br>點擊右下角「+」即可新增！</div>`;
        return;
      }

      keys.forEach(key => {
        const item = dayTravel[key];
        const itemElem = document.createElement('div');
        
        let typeClass = 'type-spot';
        let icon = '🎡';
        if (item.type === 'food') { typeClass = 'type-food'; icon = '🍴'; }
        if (item.type === 'hotel') { typeClass = 'type-hotel'; icon = '🏨'; }

        itemElem.className = `timeline-item ${typeClass}`;
        const mapUrl = getGoogleMapsUrl(item.title);

        itemElem.innerHTML = `
          <div class="timeline-info">
            <div class="timeline-title">
              <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="map-link">
                ${icon} ${item.title} 🗺️
              </a>
            </div>
          </div>
          <button class="timeline-delete" onclick="deleteTravelItem('${dateStr}', '${key}')">✕</button>
        `;
        timelineContainer.appendChild(itemElem);
      });
    }

    /* 🗺️ 即時嵌入 Google 地圖 iframe 預覽 */
    function updateEmbeddedMap(val) {
      clearTimeout(mapTimer);
      const mapBox = document.getElementById('map-iframe-box');
      const iframe = document.getElementById('map-iframe');
      const query = val.trim();

      if (!query) {
        mapBox.style.display = 'none';
        iframe.src = '';
        return;
      }

      // 防抖動優化（使用者停頓 500ms 後才載入地圖）
      mapTimer = setTimeout(() => {
        mapBox.style.display = 'block';
        iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
      }, 500);
    }

    function openTravelModal() {
      document.getElementById('travel-title-input').value = '';
      document.getElementById('map-iframe-box').style.display = 'none';
      document.getElementById('map-iframe').src = '';
      document.getElementById('travel-modal-overlay').classList.add('active');
    }

    function closeTravelModal() {
      document.getElementById('travel-modal-overlay').classList.remove('active');
    }

    function saveTravelItem() {
      const dateStr = formatDateStr(travelCurrentDate);
      const type = document.getElementById('travel-type-input').value;
      const title = document.getElementById('travel-title-input').value.trim();

      if (!title) {
        alert('請輸入景點名稱！');
        return;
      }

      const itemKey = Date.now().toString();
      const updates = {};
      updates[`travel/${dateStr}/${itemKey}`] = { type, title };

      window.dbUpdate(window.dbRef(window.db), updates);
      closeTravelModal();
    }

    function deleteTravelItem(dateStr, key) {
      window.dbRemove(window.dbRef(window.db, `travel/${dateStr}/${key}`));
    }

    function setupGestureControls() {
      const container = document.getElementById('days-grid-container');
      const track = document.getElementById('slider-track');

      const getCellFromPoint = (x, y) => {
        const elem = document.elementFromPoint(x, y);
        return elem ? elem.closest('.day-cell:not(.empty)') : null;
      };

      const onStart = (x, y) => {
        startX = x; startY = y; currentX = x; currentY = y; dragDeltaX = 0; isHorizontalGesture = false;

        if (window.triggerTouchPointer) triggerTouchPointer(x, y);

        if (isEditMode) {
          const cell = getCellFromPoint(x, y);
          if (cell) {
            isDragging = true;
            selectedDates.clear();
            toggleCellSelection(cell);
          }
        } else {
          isSwiping = true;
          track.classList.remove('animate');
        }

        const cell = getCellFromPoint(x, y);
        if (cell && (cell.classList.contains('cell-r-off') || cell.classList.contains('cell-off'))) {
          createParticles(x, y, 30);
        }
      };

      const onMove = (x, y) => {
        currentX = x; currentY = y;
        const deltaX = currentX - startX;
        const deltaY = currentY - startY;

        if (window.triggerTouchPointer) triggerTouchPointer(x, y);

        if (isEditMode && isDragging) {
          const cell = getCellFromPoint(x, y);
          if (cell) toggleCellSelection(cell);
          return;
        }

        if (isSwiping) {
          if (!isHorizontalGesture) {
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 8) {
              isHorizontalGesture = true;
            }
          }

          if (isHorizontalGesture) {
            dragDeltaX = deltaX;
            const containerWidth = container.offsetWidth || 300;
            const percentMove = (dragDeltaX / containerWidth) * 33.3333;
            track.style.transform = `translate3d(${-33.3333 + percentMove}%, 0, 0)`;
          }
        }
      };

      const onEnd = (x, y) => {
        if (isEditMode) {
          if (isDragging) {
            isDragging = false;
            if (selectedDates.size > 0) {
              createParticles(x || window.innerWidth/2, y || window.innerHeight/2, 20);
              openModal();
            }
          }
          return;
        }

        if (isSwiping) {
          isSwiping = false;
          const containerWidth = container.offsetWidth || 300;
          const threshold = containerWidth * 0.22;

          track.classList.add('animate');

          if (dragDeltaX < -threshold) {
            track.style.transform = `translate3d(-66.6666%, 0, 0)`;
            setTimeout(() => {
              track.classList.remove('animate');
              const nextDate = new Date(currentYear, currentMonth + 1, 1);
              currentYear = nextDate.getFullYear();
              currentMonth = nextDate.getMonth();
              renderAllCalendars();
            }, 300);
          } else if (dragDeltaX > threshold) {
            track.style.transform = `translate3d(0%, 0, 0)`;
            setTimeout(() => {
              track.classList.remove('animate');
              const nextDate = new Date(currentYear, currentMonth - 1, 1);
              currentYear = nextDate.getFullYear();
              currentMonth = nextDate.getMonth();
              renderAllCalendars();
            }, 300);
          } else {
            track.style.transform = `translate3d(-33.3333%, 0, 0)`;
          }
        }
      };

      container.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        onStart(t.clientX, t.clientY);
      }, { passive: false });

      container.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        onMove(t.clientX, t.clientY);
      }, { passive: false });

      container.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        onEnd(t.clientX, t.clientY);
      });

      container.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
      container.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', (e) => onEnd(e.clientX, e.clientY));
    }

    function toggleCellSelection(cell) {
      const dateStr = cell.dataset.date;
      if (!dateStr) return;
      if (!selectedDates.has(dateStr)) {
        selectedDates.add(dateStr);
        cell.classList.add('selected');
      }
    }

    function clearSelectionUI() {
      document.querySelectorAll('.day-cell.selected').forEach(cell => {
        cell.classList.remove('selected');
      });
      selectedDates.clear();
    }

    function openModal() {
      const title = document.getElementById('modal-date-title');
      if (selectedDates.size === 1) {
        const date = Array.from(selectedDates)[0];
        title.innerText = `${parseInt(date.split('-')[1])}月${parseInt(date.split('-')[2])}日 班別設定`;
        document.getElementById('shift-input').value = shiftData[date] || '';
      } else {
        title.innerText = `已選擇 ${selectedDates.size} 天，統一設定班別：`;
        document.getElementById('shift-input').value = '';
      }
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      clearSelectionUI();
    }

    function setQuick(val) {
      document.getElementById('shift-input').value = val;
      saveData();
    }

    function saveData() {
      const val = document.getElementById('shift-input').value.trim();
      const updates = {};

      selectedDates.forEach(dateStr => {
        updates[`shifts/${dateStr}`] = val ? val : null;
      });

      window.dbUpdate(window.dbRef(window.db), updates);
      closeModal();
    }

    function createParticles(x, y, count = 20) {
      const colors = ['#ff007f', '#fe5196', '#7928ca', '#00f2fe', '#ffd700', '#ff8c00', '#ff7eb3'];
      const shapes = ['circle', 'rect'];

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        document.body.appendChild(p);

        const size = Math.random() * 9 + 4;
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        
        p.style.width = `${size}px`;
        p.style.height = shape === 'rect' ? `${size * 1.8}px` : `${size}px`;
        p.style.borderRadius = shape === 'circle' ? '50%' : '2px';
        
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.background = color;
        p.style.color = color;
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 110 + 40;
        p.style.setProperty('--dx', `${Math.cos(angle) * speed}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * speed}px`);

        setTimeout(() => p.remove(), 800);
      }
    }

    function initBackgroundParticles() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const particles = [];
      const particleCount = 80;
      let touchPos = { x: -1000, y: -1000, radius: 120 };

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = (Math.random() - 0.5) * 0.8;
          this.radius = Math.random() * 2 + 1;
          this.color = ['#00f2fe', '#ff007f', '#7928ca', '#fe5196'][Math.floor(Math.random() * 4)];
          this.alpha = Math.random() * 0.5 + 0.3;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;

          const dx = touchPos.x - this.x;
          const dy = touchPos.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < touchPos.radius) {
            const angle = Math.atan2(dy, dx);
            const force = (touchPos.radius - dist) / touchPos.radius;
            this.x -= Math.cos(angle) * force * 4;
            this.y -= Math.sin(angle) * force * 4;
          }
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = this.color;
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      window.triggerTouchPointer = (x, y) => {
        touchPos.x = x;
        touchPos.y = y;
        setTimeout(() => { touchPos.x = -1000; touchPos.y = -1000; }, 300);
      };

      function loop() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(loop);
      }
      loop();
    }

    function initGyroscopeTilt() {
      const card = document.getElementById('tilt-card');

      window.addEventListener('mousemove', (e) => {
        if (window.innerWidth < 600) return;
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const dx = (e.clientX - cx) / cx;
        const dy = (e.clientY - cy) / cy;

        card.style.transform = `rotateY(${dx * 8}deg) rotateX(${-dy * 8}deg)`;
      });

      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (!e.gamma || !e.beta) return;
          const tiltX = Math.min(Math.max(e.gamma, -25), 25) / 2.5;
          const tiltY = Math.min(Math.max(e.beta - 40, -25), 25) / 2.5;

          card.style.transform = `rotateY(${tiltX}deg) rotateX(${-tiltY}deg)`;
        }, true);
      }
    }
  </script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>瑋的班表</title>

  <!-- 引入 Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://workshift-a66f0-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbOnValue = onValue;
    window.dbSet = set;
    window.dbRemove = remove;
    window.dbUpdate = update;
  </script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #050515 0%, #100b32 40%, #1a0b2e 70%, #080014 100%);
      --card-glass: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
      
      --shift-day-bg: linear-gradient(135deg, #00c6ff, #0072ff);
      --shift-day-glow: rgba(0, 198, 255, 0.8);
      
      --shift-noon-bg: linear-gradient(135deg, #f857a6, #ff5858);
      --shift-noon-glow: rgba(248, 87, 166, 0.8);

      --shift-night-bg: linear-gradient(135deg, #8a2387, #e94057, #f27121);
      --shift-night-glow: rgba(233, 64, 87, 0.8);
      
      --shift-r-off-cell-bg: rgba(239, 68, 68, 0.25);
      --shift-r-off-cell-border: rgba(248, 113, 113, 0.8);
      --shift-r-off-bg: linear-gradient(135deg, #ff0844, #ffb199);
      --shift-r-off-glow: rgba(255, 8, 68, 0.8);

      --shift-off-bg: linear-gradient(135deg, #f77062, #fe5196);
      --shift-off-glow: rgba(254, 81, 150, 0.8);
      
      --shift-custom-bg: linear-gradient(135deg, #b224ef, #7579ff);
      --shift-custom-glow: rgba(178, 36, 239, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      position: relative;
    }

    /* 華麗背景極光光暈 */
    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.8;
      animation: float 10s ease-in-out infinite alternate;
    }

    .bg-glow-1 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, #7928ca 0%, #ff007f 100%);
      top: -80px; left: -80px;
    }

    .bg-glow-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
      bottom: -60px; right: -60px;
      animation-delay: -5s;
    }

    .bg-glow-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #ff0844 0%, #ffb199 100%);
      top: 40%; left: 30%;
      animation-delay: -2.5s;
      opacity: 0.5;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(40px, 30px) scale(1.2) rotate(180deg); }
      100% { transform: translate(-20px, 50px) scale(0.9) rotate(360deg); }
    }

    .calendar-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--card-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 12px 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 
                  inset 0 0 20px rgba(255, 255, 255, 0.15),
                  0 0 15px rgba(255, 0, 127, 0.2);
      overflow: hidden;
    }

    /* 頂部功能列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    /* 模式切換按鈕炫彩特效 */
    .mode-toggle-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(10px);
    }

    .mode-toggle-btn.edit-mode {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.8), 0 0 30px rgba(121, 40, 202, 0.5);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .header h2 {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(to right, #ffffff, #00f2fe, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .nav-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .status-bar {
      font-size: 0.72rem;
      font-weight: 600;
      color: #00f2fe;
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 0 6px rgba(0, 242, 254, 0.6);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00f2fe;
      border-radius: 50%;
      box-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .weekdays div:nth-child(6),
    .weekdays div:nth-child(7) {
      color: #ff5858;
      text-shadow: 0 0 8px rgba(255, 88, 88, 0.5);
    }

    .days-grid-container {
      flex-grow: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      perspective: 1000px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease;
    }

    /* 切換月份 3D 炫彩動畫 */
    .slide-left-out { transform: translateX(-100%) rotateY(-20deg) scale(0.9); opacity: 0; }
    .slide-left-in { transform: translateX(100%) rotateY(20deg) scale(0.9); opacity: 0; }
    .slide-right-out { transform: translateX(100%) rotateY(20deg) scale(0.9); opacity: 0; }
    .slide-right-in { transform: translateX(-100%) rotateY(-20deg) scale(0.9); opacity: 0; }

    .day-cell {
      border-radius: 12px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .day-cell.empty {
      border: none;
      background: transparent;
      cursor: default;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    /* 今日炫光光暈 */
    .day-cell.today {
      border: 2px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.8), inset 0 0 10px rgba(255, 215, 0, 0.3);
      animation: todayGlow 3s infinite alternate;
    }

    @keyframes todayGlow {
      0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
      100% { box-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 30px rgba(255, 215, 0, 0.5); }
    }

    .day-cell.today .day-number {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #000;
      border-radius: 50%;
      width: 20px; height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 900;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.9);
    }

    /* 選取狀態炫光 */
    .day-cell.selected {
      border: 2px solid #00f2fe !important;
      background: rgba(0, 242, 254, 0.3) !important;
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.9), inset 0 0 10px rgba(0, 242, 254, 0.5) !important;
      transform: scale(0.94);
    }

    .day-cell.cell-r-off {
      background: var(--shift-r-off-cell-bg) !important;
      border: 1px solid var(--shift-r-off-cell-border) !important;
      box-shadow: inset 0 0 12px rgba(255, 8, 68, 0.5);
    }

    /* 班別標籤霓虹質感 */
    .shift-tag {
      width: 98%;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 2px;
      border-radius: 6px;
      color: #fff;
      line-height: 1.15;
      word-break: break-all;
      white-space: pre-wrap;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }

    .shift-day { background: var(--shift-day-bg); box-shadow: 0 0 10px var(--shift-day-glow); }
    .shift-noon { background: var(--shift-noon-bg); color: #fff; box-shadow: 0 0 10px var(--shift-noon-glow); }
    .shift-night { background: var(--shift-night-bg); box-shadow: 0 0 10px var(--shift-night-glow); }
    .shift-r-off { background: var(--shift-r-off-bg); box-shadow: 0 0 10px var(--shift-r-off-glow); }
    .shift-off { background: var(--shift-off-bg); color: #fff; box-shadow: 0 0 10px var(--shift-off-glow); }
    .shift-custom { background: var(--shift-custom-bg); box-shadow: 0 0 10px var(--shift-custom-glow); }

    /* Modal 玻璃與光暈 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(20, 15, 45, 0.95);
      border: 1px solid rgba(255, 0, 127, 0.4);
      width: 90%;
      max-width: 340px;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255, 0, 127, 0.5);
      transform: scale(0.7) translateY(30px);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 16px;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .quick-btn {
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .quick-btn:active {
      transform: scale(0.92);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-group textarea {
      width: 100%;
      height: 68px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 0.92rem;
      color: #fff;
      outline: none;
      resize: none;
      user-select: text;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group textarea:focus {
      border-color: #ff007f;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      flex: 1;
      padding: 11px 0;
      border-radius: 12px;
      border: none;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-cancel { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-save { 
      background: linear-gradient(135deg, #ff007f, #7928ca); 
      color: #fff; 
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); 
    }

    /* 爆發星芒粒子特效 */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: explode 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes explode {
      0% { transform: translate(0, 0) scale(1.5) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 6px currentColor); }
      100% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 背景流動極光 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <div class="calendar-container">
    <div class="top-bar">
      <div class="status-bar">
        <div class="status-dot"></div>
        <span>資料同步儲存</span>
      </div>
      <button class="mode-toggle-btn" id="mode-btn" onclick="toggleEditMode()">
        <span id="mode-icon">👁️</span> <span id="mode-text">檢視模式</span>
      </button>
    </div>

    <div class="header">
      <button class="nav-btn" onclick="changeMonth(-1)">‹ 上個月</button>
      <h2 id="month-title"></h2>
      <button class="nav-btn" onclick="changeMonth(1)">下個月 ›</button>
    </div>

    <div class="weekdays">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>

    <div class="days-grid-container" id="days-grid-container">
      <div class="days-grid" id="days-grid"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-date-title">統一設定班別與備註</h3>
      
      <div class="quick-btns">
        <button class="quick-btn shift-day" onclick="setQuick('早班')">早班</button>
        <button class="quick-btn shift-noon" onclick="setQuick('中班')">中班</button>
        <button class="quick-btn shift-night" onclick="setQuick('晚班')">晚班</button>
        <button class="quick-btn shift-r-off" onclick="setQuick('輪休')">輪休</button>
        <button class="quick-btn shift-off" onclick="setQuick('休假')">休假</button>
        <button class="quick-btn" style="background: rgba(255,255,255,0.2); color:#fff;" onclick="setQuick('')">清除</button>
      </div>

      <div class="input-group">
        <label>自訂備註 / 班別：</label>
        <textarea id="shift-input" placeholder="例如：&#10;早班&#10;開會"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-action btn-save" onclick="saveData()">儲存同步</button>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let shiftData = {};

    let isEditMode = false; // 預設檢視模式
    let isDragging = false;
    let selectedDates = new Set();

    // 手勢滑動監聽變數
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    window.addEventListener('DOMContentLoaded', () => {
      const checkFirebase = setInterval(() => {
        if (window.db) {
          clearInterval(checkFirebase);
          initFirebaseListener();
        }
      }, 100);

      setupDragAndSwipeSelection();
    });

    function initFirebaseListener() {
      const shiftsRef = window.dbRef(window.db, 'shifts');
      window.dbOnValue(shiftsRef, (snapshot) => {
        const val = snapshot.val();
        shiftData = val || {};
        renderCalendar();
      });
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('mode-btn');
      const icon = document.getElementById('mode-icon');
      const text = document.getElementById('mode-text');

      if (isEditMode) {
        btn.classList.add('edit-mode');
        icon.innerText = '✏️';
        text.innerText = '編輯模式';
        createParticles(btn.offsetLeft + btn.offsetWidth/2, btn.offsetTop + btn.offsetHeight/2, 16);
      } else {
        btn.classList.remove('edit-mode');
        icon.innerText = '👁️';
        text.innerText = '檢視模式';
        clearSelectionUI();
      }
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('month-title').innerText = `${year} 年 ${month + 1} 月`;

      const grid = document.getElementById('days-grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startOffset; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        grid.appendChild(emptyCell);
      }

      const today = new Date();
      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        cell.dataset.date = dateStr;

        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          cell.classList.add('today');
        }

        const dayNumNode = document.createElement('div');
        dayNumNode.className = 'day-number';
        dayNumNode.innerText = day;
        cell.appendChild(dayNumNode);

        const shift = shiftData[dateStr] || '';
        if (shift) {
          const shiftNode = document.createElement('div');
          shiftNode.className = 'shift-tag';
          shiftNode.innerText = shift;

          const firstLine = shift.split('\n')[0].trim();

          if (firstLine === '早班' || firstLine === '早') shiftNode.classList.add('shift-day');
          else if (firstLine === '中班' || firstLine === '中') shiftNode.classList.add('shift-noon');
          else if (firstLine === '晚班' || firstLine === '晚') shiftNode.classList.add('shift-night');
          else if (firstLine === '輪休') {
            shiftNode.classList.add('shift-r-off');
            cell.classList.add('cell-r-off');
          } else if (firstLine === '休假' || firstLine === '休') shiftNode.classList.add('shift-off');
          else shiftNode.classList.add('shift-custom');

          cell.appendChild(shiftNode);
        }

        grid.appendChild(cell);
      }
    }

    function changeMonth(delta) {
      const currentGrid = document.getElementById('days-grid');

      const outClass = delta > 0 ? 'slide-left-out' : 'slide-right-out';
      const inClass = delta > 0 ? 'slide-left-in' : 'slide-right-in';

      currentGrid.classList.add(outClass);

      setTimeout(() => {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();

        currentGrid.classList.remove(outClass);
        currentGrid.classList.add(inClass);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            currentGrid.classList.remove(inClass);
          });
        });
      }, 300);
    }

    function setupDragAndSwipeSelection() {
      const container = document.getElementById('days-grid-container');

      const getCellFromPoint = (x, y) => {
        const elem = document.elementFromPoint(x, y);
        return elem ? elem.closest('.day-cell:not(.empty)') : null;
      };

      const startSelection = (x, y) => {
        touchStartX = x;
        touchStartY = y;
        touchEndX = x;
        touchEndY = y;

        if (!isEditMode) return;

        const cell = getCellFromPoint(x, y);
        if (!cell) return;
        isDragging = true;
        selectedDates.clear();
        toggleCellSelection(cell);
      };

      const moveSelection = (x, y) => {
        touchEndX = x;
        touchEndY = y;

        if (!isEditMode || !isDragging) return;

        const cell = getCellFromPoint(x, y);
        if (cell) {
          toggleCellSelection(cell);
        }
      };

      const endSelection = (x, y) => {
        if (!isEditMode) {
          const diffX = touchEndX - touchStartX;
          const diffY = touchEndY - touchStartY;

          if (Math.abs(diffX) > 50 && Math.abs(diffY) < 60) {
            if (diffX < 0) {
              changeMonth(1);
            } else {
              changeMonth(-1);
            }
          }
          return;
        }

        if (!isDragging) return;
        isDragging = false;
        if (selectedDates.size > 0) {
          createParticles(x || window.innerWidth/2, y || window.innerHeight/2, 20);
          openModal();
        }
      };

      container.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        startSelection(t.clientX, t.clientY);
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        moveSelection(t.clientX, t.clientY);
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        endSelection(t.clientX, t.clientY);
      });

      container.addEventListener('mousedown', (e) => startSelection(e.clientX, e.clientY));
      container.addEventListener('mousemove', (e) => moveSelection(e.clientX, e.clientY));
      window.addEventListener('mouseup', (e) => endSelection(e.clientX, e.clientY));
    }

    function toggleCellSelection(cell) {
      const dateStr = cell.dataset.date;
      if (!dateStr) return;
      if (!selectedDates.has(dateStr)) {
        selectedDates.add(dateStr);
        cell.classList.add('selected');
      }
    }

    function clearSelectionUI() {
      document.querySelectorAll('.day-cell.selected').forEach(cell => {
        cell.classList.remove('selected');
      });
      selectedDates.clear();
    }

    function openModal() {
      const title = document.getElementById('modal-date-title');
      if (selectedDates.size === 1) {
        const date = Array.from(selectedDates)[0];
        title.innerText = `${parseInt(date.split('-')[1])}月${parseInt(date.split('-')[2])}日 班別設定`;
        document.getElementById('shift-input').value = shiftData[date] || '';
      } else {
        title.innerText = `已選擇 ${selectedDates.size} 天，統一設定班別：`;
        document.getElementById('shift-input').value = '';
      }
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      clearSelectionUI();
    }

    function setQuick(val) {
      document.getElementById('shift-input').value = val;
      saveData();
    }

    function saveData() {
      const val = document.getElementById('shift-input').value.trim();
      const updates = {};

      selectedDates.forEach(dateStr => {
        updates[`shifts/${dateStr}`] = val ? val : null;
      });

      window.dbUpdate(window.dbRef(window.db), updates);
      closeModal();
    }

    // 爆發華麗粒子效果
    function createParticles(x, y, count = 15) {
      const colors = ['#00f2fe', '#ff007f', '#7928ca', '#43e97b', '#ffd700', '#ff5858'];
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        document.body.appendChild(p);

        const size = Math.random() * 8 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.background = color;
        p.style.color = color;
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 80 + 30;
        p.style.setProperty('--dx', `${Math.cos(angle) * speed}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * speed}px`);

        setTimeout(() => p.remove(), 700);
      }
    }

    renderCalendar();
  </script>
</body>
</html>
